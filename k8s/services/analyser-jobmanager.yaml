apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyser-jobmanager
  namespace: sanction-monitor
  labels:
    app: analyser-jobmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analyser-jobmanager
  template:
    metadata:
      labels:
        app: analyser-jobmanager
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Kafka..."
              until nc -z kafka.sanction-monitor.svc.cluster.local 9092; do
                sleep 2
              done
              echo "Kafka is ready."
      containers:
        - name: jobmanager
          image: sanction-monitor/transaction-analyser:latest
          imagePullPolicy: Never
          args: ["standalone-job", "--job-classname", "com.camwheeler.transactionanalyser.AnalyserJob"]
          ports:
            - containerPort: 6123
              name: rpc
            - containerPort: 8081
              name: web-ui
          env:
            - name: JOB_MANAGER_RPC_ADDRESS
              value: "analyser-jobmanager"
            - name: TASK_MANAGER_NUMBER_OF_TASK_SLOTS
              value: "2"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sanction-monitor-secrets
                  key: ANTHROPIC_API_KEY
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BOOTSTRAP_SERVERS
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: analyser-jobmanager
  namespace: sanction-monitor
spec:
  selector:
    app: analyser-jobmanager
  ports:
    - name: rpc
      port: 6123
      targetPort: 6123
    - name: web-ui
      port: 8081
      targetPort: 8081
