apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-consumer
  namespace: sanction-monitor
  labels:
    app: storage-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-consumer
  template:
    metadata:
      labels:
        app: storage-consumer
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Kafka..."
              until nc -z kafka.sanction-monitor.svc.cluster.local 9092; do
                sleep 2
              done
              echo "Kafka is ready."
              echo "Waiting for dashboard-db..."
              until nc -z dashboard-db 5432; do
                sleep 2
              done
              echo "dashboard-db is ready."
      containers:
        - name: storage-consumer
          image: sanction-monitor/storage-consumer:latest
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sanction-monitor-secrets
                  key: DASHBOARD_DATABASE_URL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_GROUP_ID
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 250m
