apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-filter
  namespace: sanction-monitor
  labels:
    app: transaction-filter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-filter
  template:
    metadata:
      labels:
        app: transaction-filter
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Kafka..."
              until nc -z kafka.sanction-monitor.svc.cluster.local 9092; do
                sleep 2
              done
              echo "Kafka is ready."
              echo "Waiting for sanctions-db..."
              until nc -z sanctions-db 5432; do
                sleep 2
              done
              echo "sanctions-db is ready."
      containers:
        - name: transaction-filter
          image: sanction-monitor/transaction-filter:latest
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sanction-monitor-secrets
                  key: SANCTIONS_DATABASE_URL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: MATCH_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MATCH_THRESHOLD
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: RUST_LOG
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 250m
