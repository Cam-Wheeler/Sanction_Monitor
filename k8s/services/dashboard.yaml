apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: sanction-monitor
  labels:
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      initContainers:
        - name: wait-for-dashboard-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for dashboard-db..."
              until nc -z dashboard-db 5432; do
                sleep 2
              done
              echo "dashboard-db is ready."
      containers:
        - name: dashboard
          image: sanction-monitor/dashboard:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8501
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sanction-monitor-secrets
                  key: DASHBOARD_DATABASE_URL
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 250m
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: sanction-monitor
spec:
  selector:
    app: dashboard
  ports:
    - port: 8501
      targetPort: 8501
