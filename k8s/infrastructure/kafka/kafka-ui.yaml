apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: sanction-monitor
  labels:
    app: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "Sanction-Monitor"
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "kafka.sanction-monitor.svc.cluster.local:9092"
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 250m
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: sanction-monitor
spec:
  selector:
    app: kafka-ui
  ports:
    - port: 8080
      targetPort: 8080
